plugins { id "com.android.application" }
android {
    namespace "io.github.lwtdzh.screenshotprobe"
    compileSdk 36
    ndkVersion "29.0.14206865"
    defaultConfig {
        applicationId "io.github.lwtdzh.screenshotprobe"
        minSdk 27
        targetSdk 28
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters "arm64-v8a", "x86_64" }
        externalNativeBuild { cmake { cppFlags "-std=c++17 -Wall -Wextra" } }
    }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}
