plugins { id "com.android.application" }
android {
    namespace "io.github.lwtdzh.appstateshield"
    compileSdk 36
    ndkVersion "29.0.14206865"
    defaultConfig {
        applicationId "io.github.lwtdzh.appstateshield"
        minSdk 27
        targetSdk 36
        versionCode 8
        versionName "0.3.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86" }
        externalNativeBuild { cmake { cppFlags "-std=c++17 -Wall -Wextra" } }
    }
    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    // Vector's module class loader searches in-APK libraries; keep them uncompressed/aligned.
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies { compileOnly "de.robv.android.xposed:api:82" }
