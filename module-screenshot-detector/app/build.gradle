plugins { id "com.android.application" }
android {
    namespace "io.github.lwtdzh.screenshotdetector"
    compileSdk 36
    ndkVersion "29.0.14206865"
    defaultConfig {
        applicationId "io.github.lwtdzh.screenshotdetector"
        minSdk 34
        targetSdk 36
        versionCode 2
        versionName "0.1.1"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86" }
        externalNativeBuild { cmake { cppFlags "-std=c++17" } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
}
